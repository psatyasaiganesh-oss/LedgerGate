name: LedgerGate CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q ledgergate tests
      - name: Run tests
        run: python -m unittest discover -v
      - name: Run deterministic demo
        run: python -m ledgergate demo --payments 400 --seed 13

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tested image
        run: docker build -t ledgergate:ci .
      - name: Run demo in container
        run: docker run --rm ledgergate:ci demo --payments 400 --seed 13
